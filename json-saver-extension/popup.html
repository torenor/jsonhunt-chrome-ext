<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      width: 400px;
      padding: 15px;
      margin: 0;
      background: #f5f5f5;
    }
    h2 { margin-top: 0; font-size: 18px; }
    .section { background: white; padding: 12px; margin-bottom: 10px; border-radius: 4px; }
    label { display: block; margin-bottom: 8px; font-weight: 500; }
    textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      resize: vertical;
      height: 60px;
    }
    .button-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    button {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    .btn-primary { background: #007bff; color: white; }
    .btn-primary:hover { background: #0056b3; }
    .btn-secondary { background: #6c757d; color: white; }
    .btn-secondary:hover { background: #545b62; }
    .btn-danger { background: #dc3545; color: white; }
    .btn-danger:hover { background: #bb2d3b; }
    .status {
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      margin-top: 10px;
    }
    .status.success { background: #d4edda; color: #155724; }
    .status.info { background: #d1ecf1; color: #0c5460; }
    #capturelist {
      max-height: 150px;
      overflow-y: auto;
      background: #f9f9f9;
      padding: 8px;
      border-radius: 4px;
      font-size: 11px;
      font-family: monospace;
    }
    .capture-item {
      padding: 4px;
      border-bottom: 1px solid #eee;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h2>JSON Saver</h2>

  <div class="section">
    <label>Domener å lagre (komma-separert):</label>
    <textarea id="domains" placeholder="api.example.com, api.another.com"></textarea>
    <button class="btn-primary" id="saveDomains" style="width: 100%; margin-top: 8px;">Lagre domener</button>
    <div id="statusDomains" class="status" style="display: none;"></div>
  </div>

  <div class="section">
    <label>Lagrede responses:</label>
    <div id="capturelist">Laster...</div>
    <div class="status info" id="captureCount" style="display: none; margin-top: 8px;"></div>
  </div>

  <div class="section">
    <div class="button-group">
      <button class="btn-primary" id="downloadBtn">📥 Last ned JSON</button>
      <button class="btn-danger" id="clearBtn">🗑️ Tøm</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
